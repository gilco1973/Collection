name: librarian-eval
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
permissions:
  contents: read
concurrency:
  group: librarian-eval
  cancel-in-progress: false
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - name: Is the model credential available?
        id: credential
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "ANTHROPIC_API_KEY is not set for this repository: skipping the evaluation."
          fi
      - uses: actions/checkout@v4
        if: steps.credential.outputs.present == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: steps.credential.outputs.present == 'true'
        with:
          python-version: "3.11"
      - if: steps.credential.outputs.present == 'true'
        run: pipx install poetry && poetry install
      - name: Run the golden set through the librarian chat (read-only; KB_ALLOW_LIVE is never set here)
        if: steps.credential.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KB_ROOT: ${{ github.workspace }}
          KB_LOG_FORMAT: json
          # The run's own ceiling: the CLI stops before the cumulative cost would exceed it, and the
          # per-turn chat cap bounds what any one item can spend.
          KB_MAX_BUDGET_USD: "5"
          KB_CHAT_MAX_BUDGET_USD: "0.5"
        run: poetry run kb-librarian eval --json --budget "$KB_MAX_BUDGET_USD" > eval-run.json
      - name: Job summary
        if: always() && steps.credential.outputs.present == 'true'
        run: |
          for f in .librarian/evals/*.md; do
            [ -f "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        if: always() && steps.credential.outputs.present == 'true'
        with:
          name: librarian-eval
          # Golden questions, the model's answers and cited paths — authored content, never a page body.
          path: |
            .librarian/evals/*.json
            .librarian/evals/*.md
          retention-days: 30
