name: live-smoke
on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * 1"
permissions:
  contents: read
concurrency:
  group: live-smoke
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Is the model credential available?
        id: credential
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "ANTHROPIC_API_KEY is not set for this repository: skipping the live smoke."
          fi
      - uses: actions/checkout@v4
        if: steps.credential.outputs.present == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: steps.credential.outputs.present == 'true'
        with:
          python-version: "3.11"
      - if: steps.credential.outputs.present == 'true'
        run: pipx install poetry && poetry install
      - name: Serve the API locally and run the live smoke (one real chat turn)
        if: steps.credential.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KB_ROOT: ${{ github.workspace }}
          KB_LOG_FORMAT: json
          # Chat is read-only; KB_ALLOW_LIVE is never set here. The ceilings bound what one run can spend.
          KB_CHAT_MAX_BUDGET_USD: "0.5"
          KB_CHAT_DAILY_BUDGET_USD: "1.0"
        run: |
          poetry run python deploy/serve.py &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/api/health >/dev/null && break; sleep 1; done
          python scripts/live-smoke.py --base http://127.0.0.1:8765
