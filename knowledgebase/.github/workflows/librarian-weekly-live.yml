name: librarian-weekly-live
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: librarian-live
  cancel-in-progress: false
jobs:
  live-audit:
    # Runs only when an operator has set the repository variable KB_WEEKLY_LIVE to "true".
    if: vars.KB_WEEKLY_LIVE == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pipx install poetry
      - run: poetry install
      - name: Live audit limited to frontmatter and structure
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KB_ALLOW_LIVE: "true"
          KB_MAX_TURNS: "40"
          # Enforced between turns; a single turn can overshoot.
          KB_MAX_BUDGET_USD: "3.0"
        run: poetry run kb-librarian audit --live --capabilities frontmatter,structure
      - name: Open a pull request with the librarian's changes (only when pages changed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "kb-librarian"
          git config user.email "kb-librarian@example.com"
          if git diff --quiet -- docs; then echo "no page changes"; exit 0; fi
          branch="librarian/weekly-$(date +%Y%m%d)"
          git checkout -b "$branch"
          git add docs && git commit -m "chore(kb): librarian weekly live audit"
          git push -u origin "$branch"
          gh pr create --title "Librarian weekly live audit $(date +%Y-%m-%d)" \
            --body "Changes made by the librarian's weekly live audit. Review the report artifact before merging." \
            --base "${GITHUB_REF_NAME}" --head "$branch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: librarian-live-report
          path: .librarian/reports/*.md
          retention-days: 90
