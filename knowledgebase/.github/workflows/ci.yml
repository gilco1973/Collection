name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pipx install poetry
      - run: poetry install
      - run: poetry run ruff check . && poetry run ruff format --check .
      - run: poetry run pytest -W error::claude_agent_sdk.CanUseToolShadowedWarning
      - run: scripts/verify-layout.sh
      - name: Knowledge-base contract (deterministic checks, nothing persisted)
        run: poetry run kb-librarian check

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run i18n:check
      - run: npm test
      - run: npm run build

  console-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pipx install poetry && poetry install
        working-directory: .
      - run: npm ci --no-audit --no-fund && npm run build && npx playwright install --with-deps chromium
        working-directory: ./web
      - name: Serve API + console and drive them in Chromium
        working-directory: .
        run: |
          KB_API_KEY=ci-smoke-key KB_ROOT=$PWD poetry run python deploy/serve.py &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/api/health >/dev/null && break; sleep 1; done
          BASE=http://127.0.0.1:8765 KEY=ci-smoke-key PLAYWRIGHT=$PWD/web/node_modules/playwright/index.mjs node scripts/console-smoke.mjs
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the image (never pushed from CI)
        run: docker build -f ./deploy/Dockerfile -t knowledge-base:ci .
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pipx install poetry
      - run: poetry install
      - name: Kubernetes manifests (static invariants, no cluster)
        run: poetry run python scripts/validate_k8s.py deploy/k8s
