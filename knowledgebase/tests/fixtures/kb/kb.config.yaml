version: 1
docs_root: docs
index:
  owner: enablement
  tags: [onboarding]
  audience: [everyone]
sections:
  - id: onboarding
    path: onboarding
    title: Onboarding
    owner: enablement
    review_every_days: 90
  - id: governance
    path: governance
    title: Governance
    owner: risk
    review_every_days: 30
frontmatter:
  required: [title, owner, status, reviewed, tags, audience]
  status_values: [draft, active, deprecated]
  audience_values: [new-hire, engineer, everyone]
taxonomy:
  tags: [onboarding, governance, security]
catalogs:
  - path: onboarding/catalog.yaml
    required_fields: [title, owner, url]
    url_fields: [url]
    allowed_hosts: [video.internal.example]
links:
  trusted_hosts: [docs.anthropic.com]
atlassian:
  confluence_space_key: TEST
  jira_project_key: TEST
  mirror_sections: [onboarding]
i18n:
  languages: [es, he]
