# Knowledge-base contract. The librarian reads this file to know what "healthy"
# means. Change it deliberately: every rule here becomes an audit finding.
version: 1
docs_root: docs

index:
  owner: ai-platform-enablement
  tags: [onboarding]
  audience: [everyone]

sections:
  - id: onboarding
    path: onboarding
    title: Onboarding
    owner: ai-platform-enablement
    review_every_days: 90
  - id: paved-roads
    path: paved-roads
    title: Paved roads
    owner: ai-platform-architecture
    review_every_days: 120
  - id: best-practices
    path: best-practices
    title: Best practices
    owner: ai-platform-architecture
    review_every_days: 120
  - id: skills
    path: skills
    title: Agent skills catalog
    owner: ai-platform-enablement
    review_every_days: 90
  - id: videos
    path: videos
    title: Videos
    owner: ai-platform-enablement
    review_every_days: 180
  - id: tutorials
    path: tutorials
    title: Tutorials
    owner: ai-platform-enablement
    review_every_days: 120
  - id: wiki
    path: wiki
    title: Wiki
    owner: ai-platform-enablement
    review_every_days: 180
  - id: integrations
    path: integrations
    title: Integrations
    owner: ai-platform-engineering
    review_every_days: 120
  - id: resources
    path: resources
    title: Resources
    owner: ai-platform-enablement
    review_every_days: 180
  - id: governance
    path: governance
    title: Governance
    owner: model-risk-management
    review_every_days: 90

frontmatter:
  required: [title, owner, status, reviewed, tags, audience]
  status_values: [draft, active, deprecated]
  audience_values: [new-hire, engineer, data-scientist, product, risk, leadership, everyone]

taxonomy:
  tags:
    - onboarding
    - paved-road
    - best-practice
    - security
    - governance
    - model-risk
    - prompting
    - agents
    - rag
    - evaluation
    - observability
    - cost
    - atlassian
    - tutorial
    - video
    - skill
    - glossary
    - adr
    - faq
    - data

freshness:
  # Review window for pages outside any section; sections set their own above.
  default_days: 180
  # A page may set review_every_days in its frontmatter to shorten/lengthen its window.
  allow_page_override: true

structure:
  # Every page must be linked from a README.md in its own section (not only from the index).
  require_section_readme_link: true

ci:
  # `kb-librarian check` exits 1 when any finding has one of these severities.
  blocking_severities: [critical, error]

# YAML catalogs the librarian validates (required fields, dates, URLs) and scans.
catalogs:
  - path: videos/catalog.yaml
    required_fields: [id, title, series, supports_reading_block, owner, recorded, duration_minutes, url, status]
    date_fields: [recorded]
    url_fields: [url]
    allowed_hosts: [video.internal.example]
  - path: resources/catalog.yaml
    required_fields: [title, url, why, owner, reviewed]
    date_fields: [reviewed]
    url_fields: [url]

links:
  # External hosts the offline link check treats as trusted without a network call.
  trusted_hosts:
    - docs.anthropic.com
    - platform.claude.com
    - code.claude.com
    - developer.atlassian.com
    - www.federalreserve.gov
    - www.nist.gov
    - owasp.org

atlassian:
  confluence_space_key: AIKB
  jira_project_key: AIKB
  # Sections mirrored to Confluence by `kb-librarian atlassian sync`.
  mirror_sections: [onboarding, paved-roads, best-practices, governance]

i18n:
  # Target languages for `kb-librarian translate sync` (the nightly job). Machine-translated
  # copies land under docs/i18n/<lang>/... ; English (this tree) is always the source of truth.
  languages: [es, he]

evals:
  # Pass marks for `kb-librarian eval` (the golden set in evals/golden.yaml run through the chat).
  # The command exits 1 when a run's average falls below a rate or its total cost exceeds the ceiling.
  citation_precision: 0.8
  citation_recall: 0.7
  refusal_correctness: 1.0
  max_cost_usd_per_run: 5.0
