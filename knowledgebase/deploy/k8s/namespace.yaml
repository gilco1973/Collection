# One namespace for the knowledge base. Pod Security Admission enforces the `restricted`
# profile here, so a manifest that drops any of the hardening in deployment.yaml or
# cronjob-retention.yaml is rejected by the API server, not just by scripts/validate_k8s.py.
apiVersion: v1
kind: Namespace
metadata:
  name: knowledge-base
  labels:
    app.kubernetes.io/name: knowledge-base
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
