# Applies to every knowledge-base pod (API and retention job). Ingress: only pods in the
# ingress controller's namespace, only port 8765. Egress: DNS, then TCP 443 to any destination
# (the three outbound dependencies — the model API, the identity provider and Atlassian Cloud —
# are named by host, which a NetworkPolicy cannot express). Narrow the 443 rule with `to:`
# (ipBlock / namespaceSelector) or an FQDN egress policy where your CNI supports one; the cluster
# API is reachable on 443 at network level, but no service-account token is mounted.
#
# PARAMETER: `kubernetes.io/metadata.name: ingress` is the namespace the ingress controller
# runs in; change the value if yours is called differently (e.g. ingress-nginx). If your CNI
# does not enforce NetworkPolicy the manifest applies but protects nothing — check first.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: knowledge-base
  namespace: knowledge-base
  labels:
    app.kubernetes.io/name: knowledge-base
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: knowledge-base
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
      ports:
        - protocol: TCP
          port: 8765
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
