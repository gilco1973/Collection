# Daily rebuild of the embedding index on the state volume: `kb-librarian index --embeddings`
# chunks every page of the image's docs tree and embeds only the chunks whose text changed
# (`.librarian/index/embeddings.sqlite`). The API pod and the librarian's `semantic_search` read that
# file; until the first run, search answers `"mode": "keyword"` and `doctor` warns. Same image tag,
# PVC and security context as deployment.yaml; the PVC is ReadWriteOnce, so the pod is pinned to the
# API pod's node; `Forbid` keeps two builds from overlapping. Compose equivalent, from the host's
# cron: `docker compose exec knowledge-base kb-librarian index --embeddings`.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: knowledge-base-index
  namespace: knowledge-base
  labels:
    app.kubernetes.io/name: knowledge-base
    app.kubernetes.io/component: index
    app.kubernetes.io/version: "0.1.0"
spec:
  schedule: "0 1 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: knowledge-base
            app.kubernetes.io/component: index
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: knowledge-base
                      app.kubernetes.io/component: api
          containers:
            - name: index
              image: knowledge-base:0.1.0
              imagePullPolicy: IfNotPresent
              # The CLI locates the project through KB_ROOT from the ConfigMap.
              command: ["kb-librarian", "index", "--embeddings"]
              envFrom:
                - configMapRef:
                    name: knowledge-base-config
              # KB_EMBED_URL / KB_EMBED_MODEL come from the ConfigMap; the job sees exactly one secret key,
              # never the operator key, the session secret or the model credential (a whole-Secret
              # `secretRef` here is refused by scripts/validate_k8s.py). With none set the offline
              # hash embedder runs (token overlap only).
              env:
                - name: KB_EMBED_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: knowledge-base-secrets
                      key: KB_EMBED_API_KEY
                      optional: true
              securityContext:
                runAsNonRoot: true
                runAsUser: 10001
                runAsGroup: 10001
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              volumeMounts:
                - name: state
                  mountPath: /srv/knowledge-base/.librarian
                - name: tmp
                  mountPath: /tmp
                - name: home
                  mountPath: /home/librarian
          volumes:
            - name: state
              persistentVolumeClaim:
                claimName: knowledge-base-state
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
            - name: home
              emptyDir:
                sizeLimit: 64Mi
