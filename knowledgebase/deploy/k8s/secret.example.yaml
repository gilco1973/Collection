# TEMPLATE ONLY — never fill this file in and never commit a filled copy.
# It lists the keys the API pod reads via `envFrom`. Produce the real Secret from your external
# secret manager (an ExternalSecret / SecretProviderClass that renders the same key names) or
# as a sealed secret encrypted for the target cluster; `kubectl apply` this file as-is only to
# create an empty placeholder that the secret manager then overwrites. scripts/validate_k8s.py
# fails the build if any value here is non-empty.
#
# ANTHROPIC_API_KEY        model credential the Agent SDK reads (or CLAUDE_CODE_OAUTH_TOKEN)
# KB_API_KEY               operator bearer key (break-glass); >= 16 chars; empty = no key operator
# KB_SESSION_SECRET        HMAC key for the session cookie; >= 32 chars (empty = no SSO); rotating signs everyone out
# KB_OIDC_CLIENT_SECRET    OIDC client secret (empty for a public client relying on PKCE)
# KB_ATLASSIAN_API_TOKEN   Atlassian API token (empty when Atlassian is not mirrored)
# KB_EMBED_API_KEY         embedding provider key (empty = offline hash embedder)
apiVersion: v1
kind: Secret
metadata:
  name: knowledge-base-secrets
  namespace: knowledge-base
  labels:
    app.kubernetes.io/name: knowledge-base
type: Opaque
stringData:
  ANTHROPIC_API_KEY: ""
  KB_API_KEY: ""
  KB_SESSION_SECRET: ""
  KB_OIDC_CLIENT_SECRET: ""
  KB_ATLASSIAN_API_TOKEN: ""
  KB_EMBED_API_KEY: ""
