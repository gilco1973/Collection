# The state volume, mounted at /srv/knowledge-base/.librarian by the API pod and the retention
# CronJob: audit reports, snapshots (for rollback), reader problem reports, reader records and
# the chat spend ledger. ReadWriteOnce, so the Deployment runs one replica with the Recreate
# strategy and the CronJob is scheduled onto the same node. Back it up (RUNBOOK, "Backup and
# restore"); it is the only state the service keeps.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: knowledge-base-state
  namespace: knowledge-base
  labels:
    app.kubernetes.io/name: knowledge-base
spec:
  accessModes:
    - ReadWriteOnce
  # PARAMETER: set `storageClassName` to a class that supports volume snapshots; omitted, the
  # cluster default is used.
  resources:
    requests:
      storage: 5Gi
