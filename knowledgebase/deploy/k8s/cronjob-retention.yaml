# Daily retention purge of reader records: `kb-librarian profiles purge --live` removes
# `.librarian/users/` files whose `updated_at` is older than KB_PROFILE_RETENTION_DAYS (from the
# ConfigMap; empty = the command exits 2 and nothing is removed). Same image tag, same PVC and the
# same security context as deployment.yaml; scripts/validate_k8s.py checks all three. The job
# reads only the ConfigMap — it needs no secret. The PVC is ReadWriteOnce, so the pod is pinned
# to the node running the API pod (podAffinity); `Forbid` keeps two purges from overlapping.
# Compose equivalent, from the host's cron: `docker compose exec knowledge-base kb-librarian profiles purge --live`.
# Pin a digest exactly as in deployment.yaml: knowledge-base:0.1.0@sha256:<digest> — keep the tag.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: knowledge-base-retention
  namespace: knowledge-base
  labels:
    app.kubernetes.io/name: knowledge-base
    app.kubernetes.io/component: retention
    app.kubernetes.io/version: "0.1.0"
spec:
  schedule: "30 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: knowledge-base
            app.kubernetes.io/component: retention
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: knowledge-base
                      app.kubernetes.io/component: api
          containers:
            - name: purge
              image: knowledge-base:0.1.0
              imagePullPolicy: IfNotPresent
              # The CLI locates the project through KB_ROOT from the ConfigMap (and, failing that,
              # from the image's working directory, which also holds kb.config.yaml).
              command: ["kb-librarian", "profiles", "purge", "--live"]
              envFrom:
                - configMapRef:
                    name: knowledge-base-config
              securityContext:
                runAsNonRoot: true
                runAsUser: 10001
                runAsGroup: 10001
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              volumeMounts:
                - name: state
                  mountPath: /srv/knowledge-base/.librarian
                - name: tmp
                  mountPath: /tmp
                - name: home
                  mountPath: /home/librarian
          volumes:
            - name: state
              persistentVolumeClaim:
                claimName: knowledge-base-state
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
            - name: home
              emptyDir:
                sizeLimit: 64Mi
