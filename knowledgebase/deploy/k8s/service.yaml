# ClusterIP only: the platform's ingress (TLS termination, its own session in front of "viewer")
# is the sole client, and networkpolicy.yaml enforces that at the pod. Point the Ingress /
# HTTPRoute at knowledge-base.knowledge-base.svc:8765.
apiVersion: v1
kind: Service
metadata:
  name: knowledge-base
  namespace: knowledge-base
  labels:
    app.kubernetes.io/name: knowledge-base
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: knowledge-base
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8765
      targetPort: http
      protocol: TCP
