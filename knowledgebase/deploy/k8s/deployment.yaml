# The API + console process. One replica on Recreate: the state volume is ReadWriteOnce and the
# audit manager (running audits, cancel markers) lives in this process, so two pods must never
# overlap. The image tag is the release (pyproject version); it is the same in
# cronjob-retention.yaml, and scripts/validate_k8s.py fails when the two drift.
# To pin a digest after the registry has scanned the image, append it to the same reference:
#   image: knowledge-base:0.1.0@sha256:<digest from `docker buildx imagetools inspect`>
# (the tag stays so the validator and humans still see the release; the digest is what pulls).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-base
  namespace: knowledge-base
  labels:
    app.kubernetes.io/name: knowledge-base
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "0.1.0"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: knowledge-base
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: knowledge-base
        app.kubernetes.io/component: api
        app.kubernetes.io/version: "0.1.0"
    spec:
      # The pod talks to nothing in the cluster API; no token is mounted.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: knowledge-base:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8765
              protocol: TCP
          envFrom:
            - configMapRef:
                name: knowledge-base-config
            - secretRef:
                name: knowledge-base-secrets
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          # Liveness: the process answers. Readiness: the catalog loads and .librarian/ is
          # writable (503 `not_ready` otherwise) — a not-ready pod is taken out of the Service
          # but not restarted, so an unwritable volume is visible instead of crash-looping.
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8765
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 8765
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            # Reports, snapshots, problem reports, reader records, chat spend ledger.
            - name: state
              mountPath: /srv/knowledge-base/.librarian
            # The root filesystem is read-only; these two are the only scratch areas. The
            # Agent SDK's bundled CLI writes its own state under the home directory.
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/librarian
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: knowledge-base-state
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: home
          emptyDir:
            sizeLimit: 512Mi
