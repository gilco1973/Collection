# Golden set for `kb-librarian eval`: authored questions with the pages a good answer cites.
# Rules (enforced by `load_golden`): unique ids; every `expect.paths` entry is a readable page under
# docs/ (never a withheld one); `lang` is en or one of kb.config.yaml's i18n.languages; `persona` is
# an audience value; a `refuse: true` item lists no paths. `must_contain` keywords are checked
# case-insensitively against the answer and are taken from the expected page. Tags: section + persona.
# Non-English items expect the same English paths; the runner passes the item's `lang` to the chat.
version: 1
items:
  # --- onboarding ---
  - id: onb-day-one-rules
    question: What are the three rules I must know on day one?
    persona: new-hire
    lang: en
    expect: {paths: [onboarding/day-one.md], must_contain: [customer data, model owner]}
    tags: [onboarding, new-hire]
  - id: onb-day-one-access
    question: Which access should I request on my first day?
    persona: new-hire
    lang: en
    expect: {paths: [onboarding/day-one.md], must_contain: [gateway, AIKB]}
    tags: [onboarding, new-hire]
  - id: onb-first-week
    question: What should I do in my first week?
    persona: new-hire
    lang: en
    expect: {paths: [onboarding/first-week.md], must_contain: [paved roads, tutorial]}
    tags: [onboarding, new-hire]
  - id: onb-day-60
    question: What am I expected to have done by day 60?
    persona: new-hire
    lang: en
    expect: {paths: [onboarding/30-60-90.md], must_contain: [code review, evaluation]}
    tags: [onboarding, new-hire]
  - id: onb-reading-list
    question: Which pages are required reading in week one?
    persona: new-hire
    lang: en
    expect: {paths: [onboarding/reading-list.md], must_contain: [data classification, security]}
    tags: [onboarding, new-hire]
  - id: onb-placeholders
    question: Which names in the onboarding pages are placeholders I should replace for my organisation?
    persona: engineer
    lang: en
    expect: {paths: [onboarding/README.md], must_contain: [placeholder]}
    tags: [onboarding, engineer]
