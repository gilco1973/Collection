name: ci
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python3 -m pip install --user pillow   # the pixel-parity skill's example only
      - run: scripts/verify.sh python
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: scripts/verify.sh typescript
  hub:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.ms-playwright   # scripts/verify.sh runs the OIDC browser proof when this directory exists
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: pnpm, cache-dependency-path: hub/pnpm-lock.yaml }
      - run: cd hub && pnpm install --frozen-lockfile && pnpm exec playwright-core install --with-deps chromium   # the Chromium for scripts/smoke-oidc.sh (playwright-core's own installer, the version hub/pnpm-lock.yaml pins)
      - run: scripts/verify.sh hub
  bundle:
    runs-on: ubuntu-latest
    needs: [python, hub]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: pnpm, cache-dependency-path: hub/pnpm-lock.yaml }
      - run: scripts/bundle.sh
      - uses: actions/upload-artifact@v4
        with: { name: release, path: release/ }
